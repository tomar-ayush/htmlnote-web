<h1>HTML Notebook</h1>
<p>Cloud HTML notes workspace built for humans and AI agents. Every page is saved as a standalone <code>.html</code> file so rich tables, callouts, drawings, and LLM-generated layouts never lose formatting.</p>
<h2>Storage Backends</h2>
<ul>
<li>Zero-setup free managed Cloudflare R2 storage</li>
<li>Universal S3-compatible buckets (Cloudflare R2, Backblaze B2, AWS S3, MinIO)</li>
<li>Separate Google Drive OAuth folder sync (<code>HTML Notebook</code>)</li>
</ul>
<h2>AI Agent Integration</h2>
<p>Agents can upload HTML pages directly to <code>[prefix/]&lt;notebook&gt;/&lt;section&gt;/&lt;page&gt;.html</code> in the connected bucket and HTML Notebook indexes them immediately.</p>
